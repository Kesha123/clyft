when:
  - event: pull_request
  - event: push
    branch: main

steps:
  fmt-check:
    image: &img zot.innokentii-kozlov.com/docker-images/library/golang:1.26.5
    commands:
      - make fmt-check
  tidy-check:
    image: *img
    commands:
      - make tidy-check
  vet:
    image: *img
    commands:
      - make vet
  test:
    image: *img
    commands:
      - make test
  build:
    image: *img
    commands:
      - make build
  build-container:
    image: docker:27
    commands:
      - apk add --no-cache make git
      - make containers/build/clyft
    depends_on: [build]
  start-zot:
    image: docker:27
    commands:
      - apk add --no-cache make
      - make start-zot COMPOSE_PROJECT=$CI_PIPELINE_NUMBER
    depends_on: [build-container]
  stop-zot:
    image: docker:27
    commands:
      - apk add --no-cache make
      - make stop-zot COMPOSE_PROJECT=$CI_PIPELINE_NUMBER
    depends_on: [start-zot]
